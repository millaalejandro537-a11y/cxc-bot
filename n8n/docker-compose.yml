services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: cxc_bot_n8n
    restart: unless-stopped
    # Solo localhost: nunca expuesto a la red local ni a internet.
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=America/Tegucigalpa
      - TZ=America/Tegucigalpa
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_RUNNERS_ENABLED=true
    volumes:
      # Volumen persistente: workflows, credenciales, ejecuciones sobreviven
      # a un `docker compose down` / reinicio del contenedor.
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
    name: cxc_bot_n8n_data
